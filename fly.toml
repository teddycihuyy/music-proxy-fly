# fly.toml app configuration file generated for music-proxy-fly on 2026-11-01T13:53:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'music-proxy-fly'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
